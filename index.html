<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Spending Prototype v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#111111; --sub:#8A8A8A; --wh:#FFFFFF; --ln:#D9D9D9;
  --g1:#EFEFEF; --g2:#E2E2E2; --g3:#D5D5D5; --g4:#F6F6F6;
  --ai:#FAFAFA; --page:#E9E9E6;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--page);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px max(16px,env(safe-area-inset-right)) 32px max(16px,env(safe-area-inset-left))}
header{width:100%;max-width:760px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-bottom:14px}
.ftab{padding:9px 16px;border:1px solid var(--ink);border-radius:999px;font-size:14px;font-weight:500;background:var(--wh)}
.ftab[aria-selected=true]{background:var(--ink);color:var(--wh)}
.restart{font-size:14px;color:var(--sub);padding:9px 10px;text-decoration:underline;text-underline-offset:3px}
.stage{position:relative}
.phone{width:375px;height:812px;border-radius:48px;background:var(--wh);position:absolute;top:0;left:0;overflow:hidden;transform-origin:top left;box-shadow:0 0 0 10px #1a1a1a,0 24px 60px rgba(0,0,0,.25)}
.cap{margin-top:22px;text-align:center;font-size:13px;color:var(--sub);max-width:420px}
.cap b{color:var(--ink);font-weight:600}
.cap .alts{margin-top:8px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.cap .alts button{border:1px dashed var(--ink);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--ink);background:var(--wh)}

/* screen */
.scr{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:56px 16px 120px;scrollbar-width:none;animation:fade .25s ease-out}
.scr::-webkit-scrollbar{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
.status{position:absolute;top:0;left:0;right:0;height:48px;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0;font-size:15px;font-weight:600;z-index:30;pointer-events:none}
.status .bat{width:24px;height:11px;border:1.5px solid var(--ink);border-radius:3px;position:relative}
.status .bat:after{content:"";position:absolute;inset:1.5px;right:5px;background:var(--ink);border-radius:1px}
.top{display:flex;align-items:center;margin-bottom:18px}
.av{width:38px;height:38px;border-radius:50%;background:var(--g3);border:2px solid var(--wh)}
.av+.av{margin-left:-12px;background:var(--g2)}
.plus{width:38px;height:38px;border-radius:50%;border:1px solid var(--ln);display:grid;place-items:center;margin-left:6px;font-size:20px}
.sp{flex:1}
.chev{width:38px;height:38px;border-radius:50%;background:var(--g1);display:grid;place-items:center;font-size:16px}
.ttl{margin-bottom:16px}
.lab{font-size:17px;color:var(--sub)}
.big{font-size:58px;font-weight:500;letter-spacing:-.03em;line-height:1.02}
.bk{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.circ{width:42px;height:42px;border-radius:50%;border:1px solid var(--ln);display:grid;place-items:center;font-size:18px}
.bk span{font-size:17px;font-weight:500}
.h2{font-size:30px;font-weight:500;letter-spacing:-.02em;line-height:1.1;margin-bottom:10px}
.p{font-size:15px;line-height:1.4;color:#333}
.small{font-size:13px;color:var(--sub);line-height:1.4}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}

.pill{display:inline-flex;align-items:center;height:26px;padding:0 11px;border:1px solid var(--ink);border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.pill.fill{background:var(--ink);color:var(--wh)}
.pill.dash{border-style:dashed}

/* banner */
.banner{background:var(--g1);border-radius:24px;padding:14px 14px 14px 18px;display:flex;gap:12px;align-items:center;margin-bottom:18px}
.banner .p{flex:1;font-size:14px}
.banner.dark{background:var(--ink);color:var(--wh)}
.banner.dark .p{color:var(--wh)}
.mini{height:36px;padding:0 14px;border-radius:999px;background:var(--ink);color:var(--wh);font-size:13px;font-weight:500;white-space:nowrap}
.banner.dark .mini{background:var(--wh);color:var(--ink)}

/* total */
.tot{background:var(--g4);border-radius:32px;padding:18px 20px 20px;margin-bottom:12px;position:relative}
.num{font-size:56px;font-weight:500;letter-spacing:-.035em;line-height:1;margin-top:12px}
.num span{opacity:.4}
.num.m{font-size:44px}
.lines{margin-top:14px;display:grid;gap:10px}
.ln .lt{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.ln .lt b{font-weight:500}
.track{height:1px;background:var(--ink);opacity:.25;position:relative}
.ln .bar{position:relative;height:5px}
.ln .bar:before{content:"";position:absolute;left:0;right:0;top:2px;height:1px;background:#bbb}
.ln .bar i{position:absolute;left:0;top:0;height:5px;background:var(--ink);border-radius:3px}

/* stacked cards */
.stack{padding-bottom:4px}
.card{position:relative;height:118px;border-radius:32px;padding:16px 18px;margin-top:-46px;box-shadow:0 -1px 0 rgba(255,255,255,.8)}
.card:first-child{margin-top:0}
.card+.card:before{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:var(--wh);left:50%;top:-7px;margin-left:-7px}
.card.dashd{background:var(--wh)!important;border:1.5px dashed #9a9a9a}
.card.tap{cursor:pointer}
.card.tap:active{filter:brightness(.97)}
.crow{display:flex;align-items:center;gap:12px}
.ic{width:40px;height:40px;border-radius:50%;background:var(--wh);display:grid;place-items:center;font-size:15px;font-weight:600;flex:none}
.cm{flex:1;min-width:0}
.cat{font-size:13px;opacity:.55}
.mer{font-size:21px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-size:19px;font-weight:500;white-space:nowrap}
.cflag{position:absolute;right:18px;top:62px}
.csub{position:absolute;left:70px;top:66px;font-size:13px;opacity:.6}
.card.last{height:auto;min-height:118px}
.card.x{cursor:pointer;transition:height .35s cubic-bezier(.2,.8,.2,1)}
.card.x .crow{pointer-events:none}
.det{position:absolute;left:18px;right:18px;top:100px;opacity:0;transform:translateY(-6px);transition:opacity .25s,transform .3s;pointer-events:none}
.card.open .det{opacity:1;transform:none;pointer-events:auto}
.det .row{padding:9px 0;font-size:14px;border-top:1px solid rgba(0,0,0,.12)}
.det .row:first-child{border-top:0}
.det .mb{display:flex;align-items:flex-end;gap:6px;height:54px}
.det .mb div{flex:1;text-align:center;font-size:11px;opacity:.7}
.det .mb i{display:block;background:var(--ink);border-radius:3px;margin:0 auto 4px;width:100%}
.det .note{font-size:13px;opacity:.7;margin-top:8px;line-height:1.35}

/* AI card */
.ai{background:var(--ai);border:1.5px dashed var(--ink);border-radius:28px;padding:16px 18px 18px;margin-bottom:12px}
.ai .pill{border-style:dashed}
.ai .h{font-size:20px;font-weight:500;letter-spacing:-.01em;line-height:1.25;margin-top:10px}
.ai .p{margin-top:6px}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--ln);font-size:15px}
.row:first-of-type{border-top:0}
.row .r{font-weight:500}
.rows .row:first-child{border-top:0}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:54px;border-radius:999px;background:var(--ink);color:var(--wh);font-size:16px;font-weight:500;margin-top:10px}
.ghost{display:flex;align-items:center;justify-content:center;width:100%;height:54px;border-radius:999px;border:1px solid var(--ink);font-size:16px;font-weight:500;margin-top:10px}
.tbtn{display:block;width:100%;text-align:center;padding:14px 0 4px;font-size:15px;color:var(--sub);text-decoration:underline;text-underline-offset:3px}
.btn2{display:flex;gap:9px;margin-top:10px}
.btn2 button{flex:1;height:50px;border-radius:999px;border:1px solid var(--ink);font-size:15px;font-weight:500}
.btn:active,.ghost:active,.btn2 button:active{transform:scale(.98)}
.links{display:flex;justify-content:center;gap:22px}
.links .tbtn{width:auto}

/* toast */
.toast{position:absolute;left:16px;right:16px;bottom:94px;min-height:52px;border-radius:999px;background:var(--ink);color:var(--wh);display:flex;align-items:center;gap:10px;padding:0 8px 0 22px;font-size:14px;z-index:40;animation:up .3s ease-out}
.toast.low{bottom:40px}
.toast span{flex:1;line-height:1.3;padding:10px 0}
.toast button{height:38px;padding:0 14px;border-radius:999px;background:var(--wh);color:var(--ink);font-weight:500;font-size:13px}

.toast.fade{animation:up .3s ease-out,out .4s 2.8s forwards}
@keyframes out{to{opacity:0;transform:translateY(12px);visibility:hidden}}
@keyframes up{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}

/* sheet */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:50;cursor:pointer;animation:fade .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--wh);border-radius:36px 36px 0 0;padding:12px 20px 34px;z-index:51;max-height:86%;overflow-y:auto;animation:sh .3s ease-out}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--ln);margin:0 auto 18px}
@keyframes sh{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.base{pointer-events:none}

/* tab bar */
.tabbar{position:absolute;left:16px;bottom:22px;width:343px;height:58px;border-radius:999px;background:var(--ink);display:flex;align-items:center;padding:5px;z-index:35}
.tabbar div{cursor:pointer;flex:1;height:48px;border-radius:999px;display:grid;place-items:center;font-size:14px;color:rgba(255,255,255,.6)}
.tabbar div.on{background:var(--wh);color:var(--ink);font-weight:500}

/* chips, choices */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:40px;padding:0 16px;border:1px solid var(--ink);border-radius:999px;font-size:14px;font-weight:500}
.chip.on{background:var(--ink);color:var(--wh)}
.opt{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--ln);border-radius:20px;margin-top:8px;background:var(--wh);width:100%;text-align:left}
.opt.on{border:1.5px solid var(--ink)}
.radio{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--ink);flex:none;margin-top:2px;position:relative}
.optcard[aria-pressed=true] .radio:after,.opt.on .radio:after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--ink)}
.box{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--ink);flex:none;display:grid;place-items:center;font-size:13px;color:var(--wh)}
.on .box{background:var(--ink)}
.opt .t{font-size:16px;font-weight:500}
.input{height:52px;border:1px solid var(--ln);border-radius:999px;display:flex;align-items:center;padding:0 20px;font-size:15px;color:var(--sub);margin-top:12px}

/* slider */
.slider{position:relative;height:30px;margin:18px 4px 6px}
.slider .base1{position:absolute;left:0;right:0;top:14px;height:1px;background:#bbb}
.slider .band{position:absolute;top:8px;height:14px;background:var(--g2);border-radius:7px}
.slider .fillb{position:absolute;left:0;top:12px;height:5px;background:var(--ink);border-radius:3px}
.slider .knob{position:absolute;top:3px;width:24px;height:24px;border-radius:50%;background:var(--wh);border:1.5px solid var(--ink);margin-left:-12px;transition:left .2s}
.step{display:flex;gap:9px;margin-top:12px}
.step button{flex:1;height:44px;border:1px solid var(--ink);border-radius:999px;font-size:15px;font-weight:500}
.seg{display:flex;background:var(--ink);border-radius:999px;padding:4px;margin-top:16px}
.seg button{flex:1;height:42px;border-radius:999px;color:rgba(255,255,255,.7);font-size:14px;font-weight:500}
.seg button.on{background:var(--wh);color:var(--ink)}

/* bars */
.vbars{display:flex;align-items:flex-end;gap:3px;height:70px;margin-top:14px}
.vbars i{flex:1;background:var(--ink);border-radius:2px;min-height:2px}
.vbars i.z{background:var(--ln)}
.vbars i.lt{background:#B5B5B5}

/* notched split cards */
.split{background:var(--g1);border-radius:28px;padding:16px 18px;position:relative;margin-top:-1px}
.split+.split{margin-top:6px}
.split+.split:before{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:var(--wh);left:50%;top:-10px;margin-left:-7px}
.toggle{width:46px;height:28px;border-radius:999px;background:var(--ink);position:relative;flex:none}
.toggle:after{content:"";position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--wh)}
.toggle.off{background:var(--ln)}.toggle.off:after{right:auto;left:3px}

/* lock screen */
.lock{position:absolute;inset:0;background:linear-gradient(180deg,#CFCFCF,#9E9E9E);padding:90px 14px 0;text-align:center;color:var(--ink)}
.lock .d{font-size:19px;font-weight:500}
.lock .t{font-size:96px;font-weight:500;letter-spacing:-.04em;line-height:1}
.notif{margin-top:300px;background:rgba(255,255,255,.88);border:1.5px dashed var(--ink);border-radius:26px;padding:14px 16px;text-align:left;width:100%;animation:up .5s ease-out}
.notif .nh{display:flex;justify-content:space-between;font-size:13px;color:#555}
.notif .nt{font-size:16px;font-weight:600;margin-top:6px}
.notif .nb{font-size:14px;line-height:1.35;margin-top:2px}

/* plan options */
.optcard{background:var(--wh);border:1px solid var(--ln);border-radius:24px;padding:14px 16px;margin-top:10px}
.optcard .oh{display:flex;justify-content:space-between;align-items:center}
.optcard .ot{font-size:18px;font-weight:500}
.segbar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin:12px 0 8px}
.segbar i:nth-child(1){background:var(--ink)}
.segbar i:nth-child(2){background:#7A7A7A}
.segbar i:nth-child(3){background:#BDBDBD}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:#444}
.sk{height:12px;border-radius:6px;background:linear-gradient(90deg,#eee,#ddd,#eee);background-size:200% 100%;animation:sk 1.2s infinite linear;margin-top:10px}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
.sq{display:inline-block;width:14px;height:14px;border-radius:4px;background:var(--ink);margin-right:3px}
.sq.l{background:var(--ln)}
.thanks{font-size:13px;color:var(--ink);text-align:center;padding-top:12px}

/* ================= COLOR + GLASS LAYER ================= */
:root{--ink:#1C1D2B;--sub:#9A9CB2;--ln:#E3E5F0;--blue:#3B5BF0;--orange:#FF7A45;--lav:#E4E7FC;--bg:#F4F5FB;--page:#E8EAF5;
 --pink:#FF4F9A;--pinkdk:#D12A78}
html,body{background:var(--page);color:var(--ink)}
.ftab{border-color:#D6D8EA;color:var(--ink)}
.ftab[aria-selected=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.phone{background:var(--bg);box-shadow:0 0 0 10px #1C1D2B,0 30px 70px rgba(40,50,120,.28)}
.status{color:var(--ink)}
.av{background:linear-gradient(135deg,#FFC2A3,#FF8D5C);border-color:var(--bg)}
.av+.av{background:linear-gradient(135deg,#B7C4FF,#6E86F7)}
.plus,.chev,.circ{background:#fff;border:0;box-shadow:0 4px 12px rgba(40,50,120,.08)}
.big{font-weight:400;letter-spacing:-.035em}
.lab{color:var(--sub)}
.p{color:#4A4C60}
.small{color:var(--sub)}
.pill{border:0;background:var(--lav);color:#4B55A8;height:28px;padding:0 12px}
.pill.fill{background:var(--blue);color:#fff}
/* surfaces */
.tot{background:#fff;box-shadow:0 10px 30px -14px rgba(40,50,120,.25)}
.num span{opacity:.3}
.ln .bar:before{background:var(--ln)}
.ln .bar i{background:var(--blue)}
.banner{background:#fff;box-shadow:0 10px 30px -14px rgba(40,50,120,.25)}
.banner.dark{background:var(--ink)}
.mini{background:var(--blue)}
.banner.dark .mini{background:#fff;color:var(--ink)}
/* stacked cards */
.card{box-shadow:0 -8px 20px -6px rgba(40,50,120,.10)}
.card+.card:before{background:var(--bg)}
.card.dark{color:#fff}
.card.dark .cat{opacity:.75}
.card.dark .ic{background:rgba(255,255,255,.2);color:#fff}
.card:not(.dark) .ic{background:var(--bg);color:var(--blue)}
.card.dashd{background:transparent!important;border:1.5px dashed #C3C7E2;box-shadow:none}
.card.dashd .ic{background:#fff}
.det .row{border-top-color:color-mix(in srgb,currentColor 18%,transparent)}
.det .mb i{background:currentColor}
.card .ln .bar i{background:currentColor}
.card .ln .bar:before{background:color-mix(in srgb,currentColor 25%,transparent)}
.card .note{opacity:.75}
/* buttons */
.btn{background:var(--blue);box-shadow:0 12px 22px -10px rgba(59,91,240,.7)}
.ghost,.btn2 button{background:#fff;border:0;box-shadow:0 4px 14px rgba(40,50,120,.08)}
.tbtn{color:var(--sub)}
.toast{background:var(--ink);box-shadow:0 14px 30px -10px rgba(28,29,43,.5)}
.toast button{color:var(--blue)}
.dim{background:rgba(28,29,43,.32)}
.sheet{background:#fff}
.tabbar{background:#fff;box-shadow:0 12px 30px -8px rgba(40,50,120,.25)}
.tabbar div{color:var(--sub)}
.tabbar div.on{background:var(--blue);color:#fff}
/* controls */
.chip{border:0;background:var(--bg);color:var(--ink)}
.sheet .chip{background:var(--bg)}
.chip.on{background:var(--blue);color:#fff}
.opt{border:1.5px solid transparent;background:#fff;box-shadow:0 4px 14px rgba(40,50,120,.07)}
.opt.on{border-color:var(--blue)}
.radio{border-color:#C3C7E2}
.opt.on .radio,.optcard[aria-pressed=true] .radio{border-color:var(--blue)}
.opt.on .radio:after,.optcard[aria-pressed=true] .radio:after{background:var(--blue)}
.box{border-color:#C3C7E2}
.on .box{background:var(--blue);border-color:var(--blue)}
.input{background:#fff;border:0;box-shadow:inset 0 0 0 1px var(--ln)}
.slider .base1{background:var(--ln)}
.slider .band{background:var(--lav)}
.slider .fillb{background:var(--blue)}
.slider .knob{border:0;box-shadow:0 3px 10px rgba(40,50,120,.3)}
.step button{background:#fff;border:0;box-shadow:0 4px 14px rgba(40,50,120,.08)}
.seg{background:var(--lav)}
.seg button{color:#6A6F9A}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 3px 10px rgba(40,50,120,.15)}
.toggle{background:var(--blue)}
.toggle.off{background:var(--ln)}
.vbars i{background:var(--blue)}
.vbars i.lt{background:#B5C1FB}
.vbars i.z{background:var(--ln)}
.split{background:#fff;box-shadow:0 8px 24px -14px rgba(40,50,120,.25)}
.split+.split:before{background:var(--bg)}
.optcard{border:1.5px solid transparent;box-shadow:0 4px 14px rgba(40,50,120,.07)}
.optcard[aria-pressed=true]{border-color:var(--blue)!important}
.segbar i:nth-child(1){background:var(--blue)}
.segbar i:nth-child(2){background:var(--orange)}
.segbar i:nth-child(3){background:#B5C1FB}
.sq{background:var(--blue)}.sq.l{background:var(--ln)}
.lock{background:radial-gradient(120% 70% at 20% 10%,#B9C6FF 0,#7C8FF5 45%,#3B5BF0 100%);color:#fff}
.lock .d,.lock .t{color:#fff}

/* ---------- AI = thick glass (pink lives only here) ---------- */
.ai,.notif{position:relative;isolation:isolate;background:transparent!important;border:0!important;border-radius:30px;
 box-shadow:0 0 0 1px rgba(255,255,255,.7),0 26px 40px -18px rgba(209,42,120,.35),0 6px 14px -6px rgba(60,30,110,.18)}
.ai::before,.notif::before{content:"";position:absolute;z-index:-2;inset:-12px -10px -12px -12px;pointer-events:none;
 background:
  radial-gradient(circle at calc(100% - 52px) 52px,#FFA3CE 0,#FF4F9A 30px,#E6337F 48px,rgba(230,51,127,0) 49px),
  radial-gradient(circle at 40px calc(100% - 36px),#FFD0E5 0,#FF86BB 22px,rgba(255,134,187,0) 30px)}
.ai::after,.notif::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;pointer-events:none;

<body>
<div class="wrap">
  <header role="tablist">
    <button class="ftab" data-flow="1" role="tab">Flow 1 · Smart Ledger</button>
    <button class="ftab" data-flow="2" role="tab">Flow 2 · Heads-up</button>
    <button class="ftab" data-flow="3" role="tab">Flow 3 · Re-plan</button>
    <button class="restart" id="restart">Restart</button>
  </header>
  <div class="stage" id="stage"><div class="phone" id="phone"></div></div>
  <div class="cap" id="cap"></div>
</div>
<script>
const G=['#3B5BF0','#FFFFFF','#E4E7FC','#FF7A45'],DARK=[1,0,0,1];
const st={share:50,guess:0,move:'Shopping',checks:[true,true,false,true],nextTime:true,lim:{Dining:300,Groceries:450,Fun:150,Shopping:200,Gas:160,'Personal care':null},touched:{},cat:'Fun',draft:null,opt:'A',seg:'oct',useful:null,oneoff:[true,false,false]};

/* ---------- helpers ---------- */
const status=()=>`<div class="status"><span>9:41</span><span class="bat"></span></div>`;
const topRow=()=>`<div style="height:14px"></div>`;
const ttl=(l,b)=>`<div class="ttl"><div class="lab">${l}</div><div class="big">${b}</div></div>`;
const back=t=>`<div class="bk"><button class="circ" data-go="back" aria-label="Back">←</button><span>${t}</span></div>`;
const pill=(t,c='')=>`<span class="pill ${c}">${t}</span>`;
const money=(whole,cents='.00',cls='')=>`<div class="num ${cls}">${whole}<span>${cents}</span></div>`;
const line=(l,v,pct)=>`<div class="ln"><div class="lt"><span>${l}</span><b>${v}</b></div><div class="bar"><i style="width:${pct}%"></i></div></div>`;
const tot=(label,whole,cents,extra='')=>`<div class="tot">${pill(label)}${money(whole,cents)}${extra}</div>`;
const DET={
 'Blue Bottle':[['When','Oct 26 · 8:12 AM'],['Card','Visa ••18'],['Category','Coffee']],
 'Trader Joe’s':[['When','Oct 25 · 6:40 PM'],['Card','Debit ••07'],['Category','Groceries']],
 'Target':[['When','Oct 23 · 5:12 PM'],['Card','Debit ••07'],['Bank text','TARGET 00031 FREMONT']],
 'Shell':[['When','Oct 24 · 7:55 AM'],['Card','Chase Sapphire ••42'],['Category','Gas']],
 'JKM Kitchen':[['When','Oct 24 · 1:40 PM'],['Card','Visa ••18'],['Bank text','SQ *JKM LLC']],
 'JKM Salon':[['When','Oct 24 · 1:40 PM'],['Card','Visa ••18'],['Bank text','SQ *JKM LLC']],
 'Kinjo':[['Full bill','$90.00 · Visa'],['Jamie paid back','+$40.00'],['Counts in Dining','Your share only']],
 'From Jamie':[['When','Oct 22 · 9:14 PM'],['Via','Venmo'],['Linked to','Kinjo dinner']],
 'Venmo · Daniel':[['When','Oct 25 · 4:02 PM'],['Note','“wedding”'],['Category','Gift']]};
const HIST={Dining:[290,312,270],Groceries:[430,475,415],Fun:[160,128,145],Shopping:[210,184,226],Gas:[150,171,143]};
function detail(it){
  if(DET[it.name]&&!it.old)return {h:DET[it.name].length*37,html:rows(DET[it.name])};
  const m=/\$(\d+) of \$(\d+)/.exec(it.cat);
  if(m){const a=+m[1],b=+m[2];return {h:84,html:`<div class="lines" style="margin:0">${line('Spent',`$${a} of $${b}`,Math.min(100,a/b*100))}</div><div class="note">$${b-a} left for the rest of October.</div>`};}
  if(HIST[it.name]){const v=HIST[it.name],mx=Math.max(...v);return {h:96,html:`<div class="mb">${['Aug','Sep','Oct'].map((mo,k)=>`<div><i style="height:${8+(v[k]-Math.min(...v))/(mx-Math.min(...v)||1)*26}px"></i>${mo} $${v[k]}</div>`).join('')}</div><div class="note">Your last three months</div>`};}
  if(it.cat==='On track'){const sp={Groceries:[312,450],Fun:[64,110]}[it.name]||[0,1];return {h:84,html:`<div class="lines" style="margin:0">${line('Spent',`$${sp[0]} of $${sp[1]}`,sp[0]/sp[1]*100)}</div><div class="note">Likely to finish under the limit.</div>`};}
  if(it.when&&/^[−+]/.test(it.amt||''))return {h:2*37,html:rows([['When',it.when],['Category',it.cat.split(' · ')[0]]])};
  if(it.name==='Personal care')return {h:52,html:`<div class="note" style="margin:0">Not enough history yet. I’ll suggest a limit after two months of charges.</div>`};
  return null;
}
const ICON={
 Dining:'<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/>',
 Coffee:'<path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><path d="M6 2v2M10 2v2M14 2v2"/>',
 Groceries:'<path d="m5 11 4-7"/><path d="m19 11-4-7"/><path d="M2 11h20"/><path d="m3.5 11 1.6 7.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6l1.7-7.4"/><path d="M9 15v2M15 15v2"/>',
 Gas:'<path d="M3 22h12"/><path d="M4 9h10"/><path d="M14 22V4a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v18"/><path d="M14 13h2a2 2 0 0 1 2 2v2a2 2 0 0 0 4 0V9.8a2 2 0 0 0-.6-1.4L18 5"/>',
 Shopping:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/>',
 Household:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/>',
 Gifts:'<rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/>',
 'Personal care':'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/>',
 Fun:'<path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/><path d="M13 5v2M13 11v2M13 17v2"/>',
 Transfer:'<path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/>',
 Other:'<circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>'};
const PICK=['Dining','Groceries','Coffee','Shopping','Gas','Household','Gifts','Personal care','Fun','Other'];
const icon=k=>`<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]||ICON.Other}</svg>`;
const keyOf=str=>{if(!str)return null;if(/^Venmo/.test(str))return 'Transfer';if(/^Gift/.test(str))return 'Gifts';return Object.keys(ICON).find(k=>str.startsWith(k))||null;};
const card=(it,i)=>{
  const isTx=/^[−+]/.test(it.amt||'');
  const over=isTx&&st.cats[it.name];
  if(over)it={...it,cat:over};
  const k=keyOf(it.cat)||keyOf(it.name);
  const l=k?icon(k):(it.icon||it.name.replace(/[^A-Za-z]/g,'')[0]);
  const d=it.go?null:detail(it);
  return `<div class="card ${it.dashed?'dashd':''} ${it.go?'tap':''} ${d?'x':''} ${it.last?'last':''} ${DARK[i%4]&&!it.dashed?'dark':''}" style="background:${G[i%4]};z-index:${i}" ${it.go?`data-go="${it.go}"`:''} ${d?`data-card data-dh="${d.h}"`:''}>${d?`<div class="det">${d.html}</div>`:''}
  <div class="crow">${isTx&&k&&k!=='Transfer'?`<button class="ic recat" data-recat="${it.name}" aria-label="Change category for ${it.name}">${l}</button>`:`<div class="ic">${l}</div>`}<div class="cm"><div class="cat"><span class="ct">${it.cat}</span>${it.flag?` ${pill(it.flag,(it.flagc??'dash')+' sm')}`:''}</div><div class="mer">${it.name}</div></div><div class="amt">${it.amt}</div></div>
  ${it.sub?`<div class="csub">${it.sub}</div>`:''}</div>`;
};
const stack=items=>`<div class="stack">${items.map((it,i)=>card(it,i)).join('')}</div>`;
const ai=(p,inner)=>`<div class="ai">${pill(p)}${inner}</div>`;
const btn=(l,g)=>`<button class="btn" data-go="${g}">${l}</button>`;
const ghost=(l,g)=>`<button class="ghost" data-go="${g}">${l}</button>`;
const tbtn=(l,g)=>`<button class="tbtn" data-go="${g}">${l}</button>`;
const btn2=(a,ga,b,gb)=>`<div class="btn2"><button data-go="${ga}">${a}</button><button data-go="${gb}">${b}</button></div>`;
const toast=(t,undo,low,fade)=>`<div class="toast ${low?'low':''} ${fade?'fade':''}"><span>${t}</span>${undo?`<button data-go="${undo}">Undo</button>`:''}</div>`;
const tabbar=a=>`<div class="tabbar">${['Home','Ledger','Limits'].map(t=>`<div class="${t===a?'on':''}" data-tab="${t}" role="button">${t}</div>`).join('')}</div>`;
const rows=r=>`<div class="rows">${r.map(([a,b])=>`<div class="row"><span>${a}</span><span class="r">${b}</span></div>`).join('')}</div>`;
const fmt=n=>'$'+n.toLocaleString('en-US');

/* common ledger items */
const BB={cat:'Coffee',name:'Blue Bottle',amt:'−$6.50'};
const TJ={cat:'Groceries',name:'Trader Joe’s',amt:'−$54.20'};
const SH={cat:'Gas',name:'Shell',amt:'−$48.00'};

/* ---------- screens ---------- */
const S={};
const F1='1',F2='2',F3='3';

/* FLOW 1 */
S['1.3']={f:F1,t:'Split check',h:()=>back('Kinjo')+
 ai('Looks like a split',`<div class="h">Jamie sent you $40 an hour after this $90 dinner.</div>
 <div class="small mt12">Your share</div>${money('$50','.00','m')}
 <div class="segbar" style="margin-top:14px"><i style="flex:50"></i><i style="flex:40"></i></div>
 <div class="legend"><span>You $50</span><span>Jamie $40</span></div>`)+
 rows([['Kinjo · Visa','$90.00'],['From Jamie · Venmo','+$40.00']])+
 `<div class="mt8"></div>`+btn('Count only my $50','SPLIT:50')+ghost('Edit my share','1.3a')+tbtn('Not a split','SPLIT:none')};
S['1.3a']={f:F1,t:'Edit share sheet',base:'1.3',sheet:()=>{
 const owes=st.share===45?'Jamie still owes you $5':st.share===50?'Jamie’s $40 covers the rest':'Pick an amount';
 return `<div class="h2">Your share of $90</div>${money('$'+st.share,'.00','m')}
 <div class="small mt8">${owes}</div>
 <div class="chips mt16"><button class="chip ${st.share===45?'on':''}" data-act="share45">Half · $45</button><button class="chip ${st.share===50?'on':''}" data-act="share50">$90 − Jamie · $50</button><button class="chip">Custom</button></div>
 ${btn('Save my share','SAVE_SHARE')}${tbtn('Not a split','SPLIT:none')}`}};
S['1.3c']={f:F1,t:'Name the charge',h:()=>{
 const g=[['Lunch · Dining','Most likely · lunch hour, near Broadway'],['Hair salon · Personal care','Possible · JKM is also a salon']];
 return back('SQ *JKM LLC')+money('$23','.00')+`<div class="small mt8">Oct 24 · 1:40 PM · Visa ••18 · Oakland</div><div class="mt16"></div>`+
 ai('My best guesses',g.map((x,i)=>`<button class="opt ${st.guess===i?'on':''}" data-act="guess${i}"><span class="radio"></span><span><span class="t">${x[0]}</span><br><span class="small">${x[1]}</span></span></button>`).join(''))+
 `<div class="input">None of these? Type what it was</div>`+btn('Save','JKM_SAVE')}};
S['1.2']={f:F1,t:'Entry · why Groceries',h:()=>back('Entry')+
 `<div class="tot"><div class="crow"><div class="ic">T</div><div class="cm"><div class="mer">Target</div><div class="cat" style="opacity:1;color:var(--sub)">Oct 23 · Debit ••07 · Groceries</div></div></div>${money('$64','.10')}</div>`+
 ai('Why Groceries',`<div class="mt8">${rows([['Bank text','TARGET 00031 FREMONT'],['Place','Fremont · Mowry Ave'],['Past visits','<span class="sq"></span><span class="sq"></span><span class="sq"></span><span class="sq l"></span><span class="sq l"></span>'],['How sure','Medium']])}</div>`)+
 btn('Looks right','back')+ghost('Change category','RECAT:Target')};
S['1.4']={f:F1,t:'Change category',get base(){return st.catBase||'1.2'},sheet:()=>`<div class="lab">${st.recat}</div><div class="h2">Move to…</div>
 <div class="catgrid">${PICK.map(c=>`<button class="cg ${st.pick===c?'on':''}" data-act="pick:${c}"><span class="ci">${icon(c)}</span><span>${c}</span></button>`).join('')}</div>${btn('Save','CAT_SAVE')}`};
S['1.4a']={f:F1,t:'Similar charges?',get base(){return st.catBase||'1.2'},sheet:()=>`<div class="h2">Change similar charges too?</div>
 <div class="p">4 other Target charges since August are in Groceries.</div>${btn('Review them','1.4b')}${ghost('Just this one','1.4d')}`};
S['1.4b']={f:F1,t:'Review similar',h:()=>{
 const d=[['Oct 12','$38.40'],['Sep 28','$112.75'],['Sep 9','$21.10'],['Aug 30','$47.00']];
 const n=st.checks.filter(Boolean).length;
 return back('Target charges')+`<div class="h2">Uncheck any that really were groceries.</div>`+
 d.map((x,i)=>`<button class="opt ${st.checks[i]?'on':''}" data-act="chk${i}"><span class="box">${st.checks[i]?'✓':''}</span><span style="flex:1"><span class="t">Target · ${x[0]}</span><br><span class="small">${st.checks[i]?'Moves to '+st.move:'Stays in Groceries'}</span></span><span class="t">${x[1]}</span></button>`).join('')+
 `<div class="mt16"></div>`+ai('Next time',`<div class="h">Send new Target charges to ${st.move} too?</div>
 <div class="chips mt12"><button class="chip ${st.nextTime?'on':''}" data-act="nt1">Yes</button><button class="chip ${!st.nextTime?'on':''}" data-act="nt0">Ask each time</button></div>`)+
 btn(`Move ${n} charge${n===1?'':'s'}`,'1.4c')}};
S['1.4c']={f:F1,t:'Rule saved',h:()=>{const n=st.checks.filter(Boolean).length;return back('Target')+
 `<div class="tot"><div class="crow"><div class="ic">T</div><div class="cm"><div class="mer">Target</div><div class="cat" style="opacity:1;color:var(--sub)">Oct 23 · Debit ••07</div></div></div>${money('$64','.10')}<div class="mt12">${rows([['Category',st.move]])}</div></div>`+
 (st.nextTime?`<div class="tot" style="background:var(--g2)">${pill('Rule')}<div class="h2 mt12">Target → ${st.move}</div><div class="small">Applies to new charges</div><button class="mini mt12">Edit rule</button></div>`:`<div class="small">We’ll ask about new Target charges each time.</div>`)},
 toast:()=>{const n=st.checks.filter(Boolean).length;return toast(`${n} charge${n===1?'':'s'} moved to ${st.move}.`,'1.4b',1)}};
S['1.4d']={f:F1,t:'Only this one',h:()=>back('Target')+
 `<div class="tot"><div class="crow"><div class="ic">T</div><div class="cm"><div class="mer">Target</div><div class="cat" style="opacity:1;color:var(--sub)">Oct 23 · Debit ••07</div></div></div>${money('$64','.10')}<div class="mt12">${rows([['Category',st.move]])}</div></div>

 A(19,{cat:'Groceries',name:'Whole Foods',amt:'−$82.40'});A(17,{cat:'Fun',name:'AMC Metreon',amt:'−$28.00'});A(15,{cat:'Gas',name:'Chevron',amt:'−$45.10'});
 A(12,{cat:'Groceries',name:'Target',amt:'−$38.40'});A(10,{cat:'Shopping',name:'Uniqlo',amt:'−$59.90'});A(8,{cat:'Coffee',name:'Blue Bottle',amt:'−$6.50'});
 A(5,{cat:'Groceries',name:'Trader Joe’s',amt:'−$61.30'});A(3,{cat:'Dining',name:'Tacos El Gordo',amt:'−$18.75'});
 return L;}
const amtNum=a=>parseFloat(a.replace(/[^\d.]/g,''))*(a.trim().startsWith('+')?-1:1);
function dayItems(d){const L=allTx().filter(t=>t.d===d).map(t=>({...t,when:`${dow(d)}, Oct ${d}`,old:d<22}));if(L.length)L[L.length-1]={...L[L.length-1],last:1};return L;}
function calendar(){const days=allTx();const has_=d=>days.some(t=>t.d===d),ai_=d=>days.some(t=>t.d===d&&t.ai);
 let cells='';for(let i=0;i<new Date(2026,9,1).getDay();i++)cells+='<span></span>';
 for(let d=1;d<=31;d++){const fut=d>TODAY;cells+=`<button class="cd ${d===st.day?'on':''} ${d===TODAY?'today':''} ${fut?'fut':''}" ${fut?'disabled':`data-act="day:${d}"`} aria-label="October ${d}">${d}${has_(d)&&!fut?`<i class="${ai_(d)?'aidot':''}"></i>`:'<i style="visibility:hidden"></i>'}</button>`;}
 return `<div class="cal"><div class="cal-h"><b>October 2026</b><span>Tap a day</span></div><div class="cal-g">${['S','M','T','W','T','F','S'].map(w=>`<span class="cal-w">${w}</span>`).join('')}${cells}</div></div>`;}
S['L']={f:F1,t:'Ledger',tab:'Ledger',h:()=>{const [w,c]=money2(monthTotal());const items=dayItems(st.day);const spent=items.reduce((a,t)=>a+Math.max(0,amtNum(t.amt)),0);
 return `<div style="height:14px"></div>`+ttl('Expenses','October')+
 tot('Spent in October',w,c,`<div class="lines">${line('Last October','$1,402',100)}${line('This October',w,Math.min(100,monthTotal()/1600*100))}</div>`)+
 calendar()+`<div class="dayh"><b>${st.day===TODAY?'Today · ':''}${dow(st.day)}, Oct ${st.day}</b><span>${items.length?'−$'+spent.toFixed(2):''}</span></div>`+
 (items.length?stack(items):`<div class="tot gdash" style="padding:18px 20px"><div class="p">No spending this day.</div></div>`)+
 `<div class="small mt8" style="text-align:center">Tap a card to open it · tap its icon to change the category</div>`}};
S['LIM']={f:F1,t:'Limits',tab:'Limits',h:()=>{const cut={};if(st.plan)PLANS[st.opt].parts.forEach(([n,v])=>cut[n]=v);
 return `<div style="height:14px"></div>`+ttl('Limits','October')+
 (has('limits')&&!st.seen.has('2.0c')?ai('Suggested limits',`<div class="h">Your limits could fit you better</div><div class="p">I looked at the last three months. One-off costs are left out.</div>${btn('See suggestions','2.0')}`):'')+
 stack(MONTH.map(([n,a],i)=>{let l=limitOf(n);if(cut[n]){l=BASE[n]-cut[n];a=SPENT[n];}return {cat:l==null?`$${a} spent · no limit`:`$${a} of $${l}`+(cut[n]?' · re-planned':''),name:n,amt:l==null?'Open':'$'+l,icon:n[0],last:i===MONTH.length-1?1:0}}))+`<button class="tbtn" data-go="E1" style="font-size:13px;color:#B4B7CB;margin-top:6px">Edit limits</button>`}};
const EDITABLE=['Dining','Groceries','Fun','Shopping','Gas'];
S['E1']={f:F1,t:'Edit limits · pick one',base:'LIM',sheet:()=>`<div class="h2">Edit a limit</div><div class="small">Pick the one you want to change.</div><div class="mt12"></div>`+
 EDITABLE.map(n=>`<button class="opt ${st.ecat===n?'on':''}" data-act="ecat:${n}" style="align-items:center"><span class="radio" style="margin-top:0"></span><span class="ci" style="color:var(--blue);display:grid">${icon(n)}</span><span class="t" style="flex:1">${n}</span><span class="t">${fmt(limitOf(n))}</span></button>`).join('')+btn('Next','E2')};
S['E2']={f:F1,t:'Edit limits · amount',base:'LIM',sheet:()=>{const n=st.ecat,c=CATS[n];if(st.edraft==null)st.edraft=limitOf(n);
 const max=Math.round(c.hi*1.6/10)*10,pct=Math.min(100,st.edraft/max*100);
 return `<div class="lab">${n} limit</div><div class="small">Now ${fmt(limitOf(n))} · You usually spend $${c.lo}–$${c.hi}</div>${money('$'+st.edraft,'')}
 <div class="slider"><div class="base1"></div><div class="band" style="left:${c.lo/max*100}%;width:${(c.hi-c.lo)/max*100}%"></div><div class="fillb" style="width:${pct}%"></div><div class="knob" style="left:${pct}%"></div></div>
 <div class="small">Shaded = what you usually spend</div>
 <div class="step"><button data-act="e-">−$10</button><button data-act="e+">+$10</button></div>${btn('Save','E_SAVE')}${tbtn('Cancel','LIMBACK')}`}};
function tabTarget(t){if(t==='Ledger')st.day=TODAY;return {Home:'H',Ledger:'L',Limits:'LIM'}[t];}
const START={'1':'H','2':'H','3':'H'};

/* ---------- router ---------- */
let flow='1',hist=[],cur='H',timer=null;
const phone=document.getElementById('phone'),cap=document.getElementById('cap');
function render(){
  clearTimeout(timer);
  const s=S[cur];let html='';st.seen.add(cur);if(s.tab&&!s.base)st.last[s.tab]=cur;if(cur==='3.5'){st.plan=true;st.daniel='planned';}if(cur==='3.5a'||cur==='3.5b')st.plan=false;if(cur==='3.3b')st.daniel='left';if(cur==='2.1'&&!st.applied){st.applied=1;ORDER.forEach(n=>{if(n in st.cur)st.cur[n]=st.lim[n];});}if(cur==='2.4a'||cur==='2.4b')st.dlim=380;
  if(s.base){const b=S[s.base];html=`<div class="scr base">${b.h()}</div>${b.tab?tabbar(b.tab):''}<div class="dim" data-go="back"></div><div class="sheet"><div class="grab"></div>${s.sheet()}</div>`;}
  else if(s.raw){html=`<div class="scr" style="padding:0">${s.h()}</div>`;}
  else{html=`<div class="scr">${s.h()}</div>${s.tab?tabbar(s.tab):''}${s.toast?s.toast():''}`;}
  if(st.flash&&!s.base){html+=`<div class="toast ${s.tab?'':'low'}"><span>${st.flash.t}</span>${st.flash.undo?'<button data-act="undoFlash">Undo</button>':''}</div>`;st.lastFlash=st.flash;st.flash=null;}
  phone.innerHTML=status()+html;
  const sc=phone.querySelector('.scr:not(.base)');if(sc&&!keepScroll)sc.scrollTop=0;
  cap.innerHTML=`<b>${cur}</b> · ${s.t}`+(s.alts?`<div class="alts">${s.alts.map(a=>`<button data-go="${a[1]}">${a[0]}</button>`).join('')}</div>`:'');
  document.querySelectorAll('.ftab').forEach(b=>b.setAttribute('aria-selected',b.dataset.flow===flow));
  if(s.auto){const here=cur;timer=setTimeout(()=>{if(cur===here)go(s.auto[0])},s.auto[1]);}
}
let keepScroll=false;
function go(id){
  if(id==='NOOP')return;
  if(id==='back'){cur=hist.length?hist.pop():START[flow];keepScroll=false;return render();}
  if(id==='SAVE_SHARE')id='SPLIT:'+st.share;
  if(id==='HOME'){hist=[];cur='H';return render();}
  if(id==='E1'){st.ecat=st.ecat||'Dining';}
  if(id==='E2'){st.edraft=null;}
  if(id==='LIMBACK'){hist=['H'];cur='LIM';st.edraft=null;return render();}
  if(id==='E_SAVE'){const n=st.ecat,prev=st.cur[n],v=st.edraft;st.cur[n]=v;if(n==='Dining')st.dlim=null;st.edraft=null;
    st.flash={t:`${n} limit is now ${fmt(v)}.`,undo:()=>{st.cur[n]=prev;}};hist=['H'];cur='LIM';return render();}
  const toL=(t,undo,day)=>{st.flash={t,undo};if(day)st.day=day;hist=['H'];cur='L';render();};
  if(id.startsWith('SPLIT:')){const v=id.slice(6),prev=st.split;st.split=v==='none'?'none':+v;
    return toL(v==='none'?'Kept as one $90 dinner.':`Only your $${v} counts in Dining.`,()=>{st.split=prev;},22);}
  if(id==='JKM_SAVE'){const v=st.guess===1?'Personal care':'Dining';st.jkm=v;return toL(`JKM charges now go to ${v}.`,()=>{st.jkm=null;},24);}
  if(id==='D_REG'){st.daniel='regular';return toL('Got it. We won’t flag these again.',()=>{st.daniel='flag';},25);}
  if(id==='D_DIS'){st.daniel='dismissed';return toL('Card dismissed. Kept as Gift.',()=>{st.daniel='flag';},25);}
  if(id==='AMT_DONE'){const c=CATS[st.cat];if(c.sug&&st.draft<c.floor)id='2.0a′';else{saveAmt(st.draft);id='2.0b';}}
  if(id==='AMT_KEEP'){saveAmt(st.draft);id='2.0b';}
  if(id==='LEAVE_OPEN'){saveAmt(null);id='2.0b';}
  if(id==='AMT_RESET'){st.draft=CATS[st.cat].sug;id='2.0a';}
  if(id==='2.0d')st.draft=null;
  if(id.startsWith('RECAT:')){st.recat=id.slice(6);st.catBase=cur;st.pick=st.cats[st.recat]||DEFCAT[st.recat]||'Other';id='1.4';}
  if(id==='CAT_SAVE'){const n=st.recat,prev=st.cats[n];st.cats[n]=st.pick;
    if(n==='Target'&&st.pick!=='Groceries'){st.move=st.pick;id='1.4a';}
    else{st.flash={t:`${n} moved to ${st.pick}.`,undo:()=>{if(prev)st.cats[n]=prev;else delete st.cats[n];}};cur=hist.length?hist.pop():START[flow];return render();}}
  if(id==='NEW_OPTS'){st.opt='D';id='3.2b';}
  if(id==='PLAN_N'){st.opt='N';id='3.4';}
  hist.push(cur);cur=id;keepScroll=false;render();
}
function rerender(){const sc=phone.querySelector('.sheet')||phone.querySelector('.scr:not(.base)');const y=sc?sc.scrollTop:0;keepScroll=true;render();const n=phone.querySelector('.sheet')||phone.querySelector('.scr:not(.base)');if(n)n.scrollTop=y;phone.querySelectorAll('.scr,.dim,.sheet,.toast').forEach(e=>e.style.animation='none');keepScroll=false;}
function act(a){
  if(a==='share45')st.share=45;else if(a==='share50')st.share=50;
  else if(a.startsWith('guess'))st.guess=+a.slice(5);
  else if(a.startsWith('move:'))st.move=a.slice(5);
  else if(a.startsWith('chk')){const i=+a.slice(3);st.checks[i]=!st.checks[i];}
  else if(a==='nt1')st.nextTime=true;else if(a==='nt0')st.nextTime=false;
  else if(a==='amt-')st.draft=Math.max(10,st.draft-10);else if(a==='amt+')st.draft=st.draft+10;
  else if(a.startsWith('opt:'))st.opt=a.slice(4);
  else if(a.startsWith('pick:'))st.pick=a.slice(5);
  else if(a.startsWith('ecat:'))st.ecat=a.slice(5);
  else if(a==='e-')st.edraft=Math.max(10,st.edraft-10);else if(a==='e+')st.edraft=st.edraft+10;
  else if(a==='undoFlash'){const f=st.lastFlash;if(f&&f.undo){f.undo();st.lastFlash=null;}}
  else if(a.startsWith('cat:')){st.cat=a.slice(4);st.draft=null;}
  else if(a.startsWith('seg:'))st.seg=a.slice(4);
  else if(a.startsWith('ht:'))st.homeTab=a.slice(3);
  else if(a.startsWith('day:'))st.day=+a.slice(4);
  else if(a==='use1')st.useful=true;else if(a==='use0')st.useful=false;
  else if(a.startsWith('oo')){const i=+a.slice(2);st.oneoff[i]=!st.oneoff[i];}
  rerender();
}
document.addEventListener('click',e=>{
  const rc=e.target.closest('[data-recat]');if(rc){go('RECAT:'+rc.dataset.recat);return;}
  const c=e.target.closest('[data-card]');if(c){toggleCard(c);return;}
  const tb=e.target.closest('[data-tab]');if(tb){const id=tabTarget(tb.dataset.tab);if(id!==cur)go(id);return;}
  const t=e.target.closest('[data-go],[data-act],[data-flow]');if(!t)return;
  if(t.dataset.flow){startFlow(t.dataset.flow);return;}
  if(t.dataset.act){act(t.dataset.act);return;}
  if(t.dataset.go)go(t.dataset.go);
});
function saveAmt(v){st.lim[st.cat]=v;st.touched[st.cat]=true;st.draft=null;}
function toggleCard(c){
  const was=c.classList.contains('open');
  c.parentElement.querySelectorAll('.card.open').forEach(o=>{o.classList.remove('open');o.style.height=o.classList.contains('last')?'':'118px';});
  if(was)return;
  const last=c.classList.contains('last');
  if(last)c.style.height=c.offsetHeight+'px';
  requestAnimationFrame(()=>{c.classList.add('open');c.style.height=(100+(+c.dataset.dh)+(last?20:58))+'px';});
}
function reset(){Object.assign(st,{share:50,guess:0,move:'Shopping',checks:[true,true,false,true],nextTime:true,lim:{Dining:300,Groceries:450,Fun:150,Shopping:200,Gas:160,'Personal care':null},touched:{},cat:'Fun',draft:null,opt:'A',seg:'oct',useful:null,oneoff:[true,false,false]});}
function startFlow(f){flow=f;hist=[];cur=START[f];reset();st.homeTab='today';st.day=TODAY;st.split=null;st.jkm=null;st.daniel='flag';st.dlim=null;st.cats={};st.catBase=null;st.flash=null;st.last={};st.seen=new Set();st.plan=false;st.applied=0;
  st.cur={Dining:300,Groceries:450,Fun:110,Shopping:200,Gas:160};
  st.ai=AI_BY_FLOW[f];   /* the only thing that differs between flows */
  render();}
document.getElementById('restart').onclick=()=>startFlow(flow);

/* scale phone to fit */
function fit(){
  const stage=document.getElementById('stage');
  const availW=Math.min(window.innerWidth-32,430);
  const availH=window.innerHeight-(document.querySelector('header').offsetHeight+90);
  const s=Math.min(1,availW/395,Math.max(.55,availH/832));
  phone.style.transform=`translate(${10*s}px,${10*s}px) scale(${s})`;
  stage.style.width=395*s+'px';stage.style.height=832*s+'px';
}
window.addEventListener('resize',fit);fit();
startFlow('1');
</script>
